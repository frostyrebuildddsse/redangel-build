name: Build RedAngel PRX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - uses: actions/checkout@v4

      # ── 2. Install compiler + linker + archiver ───────────────────────────
      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-18 lld-18 llvm-18 git unzip
          sudo ln -sf /usr/bin/clang-18   /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18 /usr/local/bin/clang++
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/ld.lld-18  /usr/local/bin/ld.lld

      # ── 3. Fix glibc multiarch headers for cross-compile ─────────────────
      - name: Fix cross-compile headers
        run: |
          sudo cp -rn /usr/include/x86_64-linux-gnu/. /usr/include/ 2>/dev/null || true

      # ── 4. Download OpenOrbis toolchain ───────────────────────────────────
      - name: Get OpenOrbis Toolchain
        run: |
          # Download tarball
          curl -fsSL \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz \
            -o toolchain.tar.gz

          # Extract (suppress broken-pipe noise)
          tar xzf toolchain.tar.gz 2>/dev/null || tar xzf toolchain.tar.gz

          # Find the extracted top-level dir by locating libSceLibcInternal.a
          LIBPATH=$(find . -maxdepth 5 -name "libSceLibcInternal.a" | head -1)
          if [ -z "$LIBPATH" ]; then
            echo "ERROR: libSceLibcInternal.a not found in tarball!"
            find . -maxdepth 4 -name "*.a" | head -20
            exit 1
          fi
          TOOLDIR=$(echo "$LIBPATH" | cut -d'/' -f2)
          echo "Toolchain extracted to: $TOOLDIR"
          mv "$TOOLDIR" openorbis

          rm toolchain.tar.gz

          # Linker script
          curl -fsSL \
            https://raw.githubusercontent.com/OpenOrbis/OpenOrbis-PS4-Toolchain/master/link.x \
            -o openorbis/link.x

          # PS4 headers (sparse checkout, include/ only)
          git clone --depth=1 --filter=blob:none --sparse \
            https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo_headers
          cd oo_headers && git sparse-checkout set include && cd ..
          cp -rf oo_headers/include/. openorbis/include/
          rm -rf oo_headers

          # Make all binaries executable
          find openorbis/bin -type f -exec chmod +x {} \; 2>/dev/null || true

          # Verify
          echo "--- Verifying toolchain ---"
          ls openorbis/link.x
          ls openorbis/lib/libSceLibcInternal.a
          ls openorbis/lib/libkernel.a
          ls openorbis/bin/linux/create-fself
          ls openorbis/include/orbis/libkernel.h
          echo "Toolchain OK"

      # ── 5. Unzip the plugin source ────────────────────────────────────────
      - name: Extract source zip
        run: unzip -q RedAngel_RE.zip && ls RedAngel_RE/

      # ── 6. Clone GoldHEN SDK ──────────────────────────────────────────────
      - name: Clone GoldHEN SDK
        run: |
          git clone --depth=1 \
            https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git \
            RedAngel_RE/GoldHEN_Plugins_SDK

      # ── 7. Build GoldHEN SDK ──────────────────────────────────────────────
      - name: Build GoldHEN SDK
        run: |
          export OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/openorbis
          make -j$(nproc)
        working-directory: RedAngel_RE/GoldHEN_Plugins_SDK

      # ── 8. Build the PRX ──────────────────────────────────────────────────
      - name: Build PRX
        run: |
          export OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/openorbis
          make -j$(nproc)
          echo "--- Build output ---"
          ls -lh build/
        working-directory: RedAngel_RE/source

      # ── 9. Upload artifact ────────────────────────────────────────────────
      - name: Upload PRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seren-rebuild-prx
          path: RedAngel_RE/source/build/Seren-rebuild.prx
          if-no-files-found: error
