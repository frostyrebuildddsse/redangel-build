name: Build RedAngel PRX

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld

      - name: Get OpenOrbis Toolchain
        run: |
          URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
                | grep browser_download_url \
                | grep -i linux \
                | cut -d '"' -f 4 \
                | head -1)
          echo "Downloading: $URL"
          curl -L -o toolchain.zip "$URL"
          unzip -q toolchain.zip -d openorbis_raw
          FIRST=$(ls openorbis_raw | head -1)
          if [ -d "openorbis_raw/$FIRST/bin" ]; then
            mv "openorbis_raw/$FIRST" openorbis
          else
            mv openorbis_raw openorbis
          fi
          chmod +x openorbis/bin/linux/*
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/openorbis" >> $GITHUB_ENV

      - name: Extract zip
        run: unzip RedAngel_RE.zip

      - name: Clone GoldHEN SDK
        run: |
          git clone --depth=1 \
            https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git \
            RedAngel_RE/GoldHEN_Plugins_SDK

      - name: Build PRX
        run: make
        working-directory: RedAngel_RE/source

      - name: Upload PRX artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedAngel-prx
          path: RedAngel_RE/source/build/Seren-rebuild.prx
          if-no-files-found: error
